[[group]]
name = "marketplace"
about = "Browse offerings and provision resources of any offering type"

  [[group.resource]]
  name = "offering"
  about = "Marketplace offerings (public)"
  columns = ["uuid", "name", "type", "state"]
    [group.resource.commands]
    list = "marketplace_public_offerings_list"
    get = "marketplace_public_offerings_retrieve"

  # Generic provisioning for ANY offering type (SLURM, VMware, custom, ...),
  # not just the typed OpenStack tenant/instance/volume commands. `provision`
  # takes a free-form `attributes` object (GenericOrderAttributes skeleton),
  # since the accepted attributes are offering-specific and not all modeled in
  # the schema; `terminate` works on any marketplace resource by uuid.
  [[group.resource]]
  name = "resource"
  about = "Marketplace resources (provision/terminate any offering)"
  columns = ["uuid", "name", "offering_name", "state"]
    [group.resource.commands]
    list = "marketplace_resources_list"
    get = "marketplace_resources_retrieve"
    [group.resource.order]
    # no offering_type -> generic provision (free-form attributes)
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale) -- excludes both the
    # body-having actions and the GET-based read-only sub-resource lookups
    # (details/history/team/...), leaving just `unlink`. `terminate` is
    # excluded even though bodyless: it collides with the hand-written
    # order-based `terminate` above.
    exclude = [
      "pull",
      "terminate",
      "add_user",
      "adjust_dates",
      "delete_user",
      "estimate_renewal",
      "move_resource",
      "reallocate_limits",
      "renew",
      "restore",
      "set_downscaled",
      "set_end_date",
      "set_end_date_by_staff",
      "set_paused",
      "set_restrict_member_access",
      "set_slug",
      "switch_plan",
      "update_limits",
      "update_options",
      "update_user",
      "details",
      "glauth_tree",
      "glauth_users_config",
      "history",
      "list_users",
      "offering",
      "offering_for_subresources",
      "plan_periods",
      "team",
      "team_members",
    ]
    [group.resource.web]
    # From waldur-homeport's src/marketplace/routes.ts -- the generic
    # resource-details page every offering type (OpenStack included) shows
    # through, keyed by this resource's own uuid.
    path = "/resource-details/{uuid}"

  # get-only: an order's uuid is what `provision --no-wait` prints, and this
  # is the direct way to check on (or `wait` for) it afterwards, rather than
  # only being able to poll a resource that a still-pending order may not
  # have created yet.
  [[group.resource]]
  name = "order"
  about = "Marketplace orders (check status of a submitted provision/terminate)"
  columns = ["uuid", "state", "resource_uuid", "error_message"]
    [group.resource.commands]
    get = "marketplace_orders_retrieve"
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale); body-having actions
    # (approve_by_provider/reject_by_*/set_backend_id/set_consumer_info/
    # set_provider_info/set_state_erred/update_attachment) and GET actions
    # (offering/resource) are excluded for now.
    exclude = [
      "approve_by_provider",
      "reject_by_consumer",
      "reject_by_provider",
      "set_backend_id",
      "set_consumer_info",
      "set_provider_info",
      "set_state_erred",
      "update_attachment",
      "offering",
      "resource",
    ]
    [group.resource.web]
    # From waldur-homeport's src/marketplace/routes.ts.
    path = "/marketplace-order-details/{uuid}/"
