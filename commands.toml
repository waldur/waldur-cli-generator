# Command manifest for waldur-cli-generator.
#
# Single source of truth for what waldur-cli's command surface covers. Each
# resource's `[group.resource.commands]` derives its list/get/create/update/
# delete operationIds from `operation_prefix` -- Waldur/DRF's standard
# ViewSet naming means every resource's operationIds are `{prefix}_list`/
# `_retrieve`/`_create`/`_update`/`_destroy`, so writing all five out per
# resource was pure repetition. `operation_prefix` is that resource's real
# operationId prefix, which isn't always identical to its own `name` (e.g.
# `offering`'s is `marketplace_public_offerings`, not `marketplace_
# offerings`) -- this is spelling it out explicitly once, not auto-discovery/
# guessing. Use `exclude` for the verbs a resource doesn't have (see
# src/manifest.rs's `deserialize_commands` for a resource whose operationIds
# don't fit this pattern at all).
#
# Deliberately not 1:1 with Waldur's ~451 operations: only list/get/create/
# update/delete are covered as direct REST verbs. OpenStack tenant/instance/
# volume creation and deletion happen through Waldur's marketplace ordering
# flow instead -- those resources declare a `[group.resource.order]` block
# (offering_type) and get `provision`/`terminate` subcommands generated for
# that async order workflow rather than a direct REST create/delete. Other
# action-style operations (start/stop/attach/approve/...) are covered
# separately, per-resource, via `[group.resource.actions]`.
#
# `columns` lists the fields shown in the default human-readable table.

[[group]]
name = "openstack"
about = "Manage OpenStack resources"

  [[group.resource]]
  name = "tenant"
  about = "OpenStack tenants"
  columns = ["uuid", "name", "state", "customer_name"]
    [group.resource.commands]
    operation_prefix = "openstack_tenants"
    exclude = ["create", "delete"]
    [group.resource.order]
    offering_type = "OpenStack.Tenant"
    [group.resource.web]
    # HomePort has no dedicated OpenStack-resource route -- it shows these
    # through the generic marketplace resource-details page, keyed by the
    # *marketplace* resource uuid (see waldur-homeport's
    # src/marketplace/routes.ts), not the tenant/instance/volume's own.
    path = "/resource-details/{uuid}"
    uuid_field = "marketplace_resource_uuid"

  [[group.resource]]
  name = "instance"
  about = "OpenStack instances (VMs)"
  columns = ["uuid", "name", "state", "project_name"]
    [group.resource.commands]
    operation_prefix = "openstack_instances"
    exclude = ["create", "delete"]
    [group.resource.order]
    offering_type = "OpenStack.Instance"
    [group.resource.actions]
    # Auto-discovered from /api/openstack-instances/{uuid}/{action}/. Scoped
    # for now to bodyless POST actions only (start/stop/restart/set_ok/
    # unlink/unrescue) -- GET actions (console/console_log/floating_ips/
    # placement_allocations/ports) and body-having actions (backup/
    # change_flavor/diagnose_connectivity/rescue/set_erred/
    # update_allowed_address_pairs/update_floating_ips/update_ports/
    # update_security_groups) are excluded for now, to keep the first
    # rollout to a simpler surface; revisit once there's a concrete need.
    # `pull` is Waldur's own backend-sync trigger, not something a CLI user
    # calls directly.
    exclude = [
      "pull",
      "console",
      "console_log",
      "floating_ips",
      "placement_allocations",
      "ports",
      "backup",
      "change_flavor",
      "diagnose_connectivity",
      "rescue",
      "set_erred",
      "update_allowed_address_pairs",
      "update_floating_ips",
      "update_ports",
      "update_security_groups",
    ]
    [group.resource.web]
    # See the tenant resource's web comment above.
    path = "/resource-details/{uuid}"
    uuid_field = "marketplace_resource_uuid"

  [[group.resource]]
  name = "volume"
  about = "OpenStack volumes"
  columns = ["uuid", "name", "state", "size"]
    [group.resource.commands]
    operation_prefix = "openstack_volumes"
    exclude = ["create", "delete"]
    [group.resource.order]
    offering_type = "OpenStack.Volume"
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale); body-having actions (attach/
    # extend/retype/set_erred/snapshot) are excluded for now.
    exclude = ["pull", "attach", "extend", "retype", "set_erred", "snapshot"]
    [group.resource.web]
    # See the tenant resource's web comment above.
    path = "/resource-details/{uuid}"
    uuid_field = "marketplace_resource_uuid"

  [[group.resource]]
  name = "network"
  about = "OpenStack networks"
  columns = ["uuid", "name", "state", "project_name"]
    [group.resource.commands]
    operation_prefix = "openstack_networks"
    exclude = ["create"]

  [[group.resource]]
  name = "subnet"
  about = "OpenStack subnets"
  columns = ["uuid", "name", "state", "cidr"]
    [group.resource.commands]
    operation_prefix = "openstack_subnets"
    exclude = ["create"]

  [[group.resource]]
  name = "security-group"
  about = "OpenStack security groups"
  columns = ["uuid", "name", "state", "project_name"]
    [group.resource.commands]
    operation_prefix = "openstack_security_groups"
    exclude = ["create"]

  [[group.resource]]
  name = "floating-ip"
  about = "OpenStack floating IPs"
  columns = ["uuid", "address", "state", "project_name"]
    [group.resource.commands]
    operation_prefix = "openstack_floating_ips"
    exclude = ["create", "update"]
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale); body-having actions
    # (attach_to_port/set_erred/update_description) are excluded for now.
    exclude = ["pull", "attach_to_port", "set_erred", "update_description"]

[[group]]
name = "team"
about = "Manage team membership and organization access"

  [[group.resource]]
  name = "customer"
  about = "Customers (organizations)"
  columns = ["uuid", "name", "abbreviation", "state"]
    [group.resource.commands]
    operation_prefix = "customers"
    [group.resource.web]
    # From waldur-homeport's src/customer/routes.ts.
    path = "/organizations/{uuid}/"

  [[group.resource]]
  name = "project"
  about = "Projects"
  columns = ["uuid", "name", "customer_name", "description"]
    [group.resource.commands]
    operation_prefix = "projects"
    [group.resource.web]
    # From waldur-homeport's src/project/routes.ts.
    path = "/projects/{uuid}/"

  [[group.resource]]
  name = "user"
  about = "Users"
  columns = ["uuid", "username", "full_name", "email"]
    [group.resource.commands]
    operation_prefix = "users"

  [[group.resource]]
  name = "role"
  about = "Roles"
  columns = ["uuid", "name", "description"]
    [group.resource.commands]
    operation_prefix = "roles"

  # PUT/PATCH don't exist -- tokens are immutable after creation, so there's
  # no `update` operationId to derive.
  [[group.resource]]
  name = "personal-access-token"
  about = "Personal access tokens (named, scoped, time-limited API credentials)"
  columns = ["uuid", "name", "token_prefix", "expires_at", "is_active"]
    [group.resource.commands]
    operation_prefix = "personal_access_tokens"
    exclude = ["update"]
    [group.resource.actions]
    # `rotate` (POST, bodyless: revokes the old token and creates a new one
    # with the same name/scopes/expiration) is the only action nested under
    # this resource's own {uuid}/ path -- available_scopes/
    # available_binding_targets/count live at the collection level instead,
    # so discovery never reaches them; no exclude list needed.

[[group]]
name = "marketplace"
about = "Browse offerings and provision resources of any offering type"

  [[group.resource]]
  name = "offering"
  about = "Marketplace offerings (public)"
  columns = ["uuid", "name", "type", "state"]
    [group.resource.commands]
    operation_prefix = "marketplace_public_offerings"
    exclude = ["create", "update", "delete"]

  # Generic provisioning for ANY offering type (SLURM, VMware, custom, ...),
  # not just the typed OpenStack tenant/instance/volume commands. `provision`
  # takes a free-form `attributes` object (GenericOrderAttributes skeleton),
  # since the accepted attributes are offering-specific and not all modeled in
  # the schema; `terminate` works on any marketplace resource by uuid.
  [[group.resource]]
  name = "resource"
  about = "Marketplace resources (provision/terminate any offering)"
  columns = ["uuid", "name", "offering_name", "state"]
    [group.resource.commands]
    operation_prefix = "marketplace_resources"
    exclude = ["create", "update", "delete"]
    [group.resource.order]
    # no offering_type -> generic provision (free-form attributes)
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale) -- excludes both the
    # body-having actions and the GET-based read-only sub-resource lookups
    # (details/history/team/...), leaving just `unlink`. `terminate` is
    # excluded even though bodyless: it collides with the hand-written
    # order-based `terminate` above.
    exclude = [
      "pull",
      "terminate",
      "add_user",
      "adjust_dates",
      "delete_user",
      "estimate_renewal",
      "move_resource",
      "reallocate_limits",
      "renew",
      "restore",
      "set_downscaled",
      "set_end_date",
      "set_end_date_by_staff",
      "set_paused",
      "set_restrict_member_access",
      "set_slug",
      "switch_plan",
      "update_limits",
      "update_options",
      "update_user",
      "details",
      "glauth_tree",
      "glauth_users_config",
      "history",
      "list_users",
      "offering",
      "offering_for_subresources",
      "plan_periods",
      "team",
      "team_members",
    ]
    [group.resource.web]
    # From waldur-homeport's src/marketplace/routes.ts -- the generic
    # resource-details page every offering type (OpenStack included) shows
    # through, keyed by this resource's own uuid.
    path = "/resource-details/{uuid}"

  # get-only: an order's uuid is what `provision --no-wait` prints, and this
  # is the direct way to check on (or `wait` for) it afterwards, rather than
  # only being able to poll a resource that a still-pending order may not
  # have created yet.
  [[group.resource]]
  name = "order"
  about = "Marketplace orders (check status of a submitted provision/terminate)"
  columns = ["uuid", "state", "resource_uuid", "error_message"]
    [group.resource.commands]
    operation_prefix = "marketplace_orders"
    exclude = ["list", "create", "update", "delete"]
    [group.resource.actions]
    # Scoped to bodyless POST actions only (see the instance resource's
    # actions comment above for the rationale); body-having actions
    # (approve_by_provider/reject_by_*/set_backend_id/set_consumer_info/
    # set_provider_info/set_state_erred/update_attachment) and GET actions
    # (offering/resource) are excluded for now.
    exclude = [
      "approve_by_provider",
      "reject_by_consumer",
      "reject_by_provider",
      "set_backend_id",
      "set_consumer_info",
      "set_provider_info",
      "set_state_erred",
      "update_attachment",
      "offering",
      "resource",
    ]
    [group.resource.web]
    # From waldur-homeport's src/marketplace/routes.ts.
    path = "/marketplace-order-details/{uuid}/"
